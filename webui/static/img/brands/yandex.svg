<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ym-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD633"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <linearGradient id="ym-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="url(#ym-ring)" stroke-width="2.5" opacity="0.9"/>
  <!-- Background circle -->
  <circle cx="24" cy="24" r="20" fill="url(#ym-bg)"/>
  <!-- Stylized "Я" letter -->
  <text x="24" y="32" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="900" fill="#1A1A1A" letter-spacing="-1">Я</text>
</svg>
